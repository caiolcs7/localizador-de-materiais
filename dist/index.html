<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="Localizador de materiais em bombonas" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <title>Localizador de Materiais</title>
  <script type="module" crossorigin src="/localizador-de-materiais/assets/index-SButZmAp.js"></script>
  <link rel="stylesheet" crossorigin href="/localizador-de-materiais/assets/index-CimFT3x8.css">
<link rel="manifest" href="/localizador-de-materiais/manifest.webmanifest"></head>
<body>
  <div id="root">
    <div id="boot-message" style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#68707c;background:#f5f6f8;padding:24px;text-align:center">
      Carregando Localizador de Materiais…
    </div>
  </div>
  <script>
    window.__LM_BOOT_OK__ = false;
    setTimeout(function () {
      if (!window.__LM_BOOT_OK__) {
        var el = document.getElementById('boot-message');
        if (el) {
          el.innerHTML = '<div><strong style="display:block;color:#15171a;margin-bottom:8px">O aplicativo não foi carregado.</strong><span style="display:block;max-width:560px">O build do Vite ainda não foi publicado. Abra a aba Actions do repositório e verifique o workflow “Build GitHub Pages into main”.</span></div>';
        }
      }
    }, 5000);
  </script>
</body>
</html>
