name: Verify Leitor DM preview

on:
  push:
    branches: [feat/leitor-dm-integration]

permissions:
  contents: read

jobs:
  browser:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate preview
        env:
          PREVIEW_URL: https://localizador-de-materiais-hgvte4gm8-caiolucas100-9244.vercel.app
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', msg => { if (msg.type()==='error') consoleErrors.push(msg.text()); });
            await page.goto(process.env.PREVIEW_URL, {waitUntil:'networkidle', timeout:90000});
            await page.getByText('Localizador de Materiais', {exact:true}).waitFor({timeout:30000});
            const leitor = page.getByRole('button', {name:/Leitor DM/i});
            if (await leitor.count() !== 1) throw new Error('Leitor DM não está visível no menu principal.');
            const scannerButtons = page.getByRole('button', {name:/^Scanner$/i});
            if (await scannerButtons.count() !== 0) throw new Error('Scanner antigo ainda está visível.');
            await leitor.click();
            await page.getByRole('heading', {name:'Levantamentos'}).waitFor({timeout:30000});
            await page.getByRole('button', {name:/Novo levantamento/i}).waitFor({timeout:30000});
            await page.getByRole('button', {name:/Configurações/i}).click();
            await page.getByRole('heading', {name:'Configurações'}).waitFor({timeout:30000});
            if (pageErrors.length) throw new Error('Page errors: '+pageErrors.join(' | '));
            const relevantConsoleErrors = consoleErrors.filter(x => !/favicon|Failed to load resource.*404/i.test(x));
            if (relevantConsoleErrors.length) throw new Error('Console errors: '+relevantConsoleErrors.join(' | '));
            console.log('PASS: Leitor DM visível, Scanner oculto, navegação interna funcional, sem erros JS.');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
