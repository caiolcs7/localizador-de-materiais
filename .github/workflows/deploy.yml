name: Quality checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Validar base inicial
        run: npm run verify:data

      - name: Validar dados dos Carrinhos
        run: npm run verify:carts

      - name: Validar fotos das luminárias
        run: npm run verify:luminaire-images

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Executar testes automatizados
        run: npm test

      - name: Gerar build do Vite
        run: npm run build
