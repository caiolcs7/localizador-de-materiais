name: Build GitHub Pages into main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[pages-build]')
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar base inicial
        run: npm run verify:data

      - name: Validar dados dos Carrinhos
        run: npm run verify:carts

      - name: Validar fotos das luminárias
        run: npm run verify:luminaire-images

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Restaurar entrada fonte do Vite
        run: cp index.source.html index.html

      - name: Gerar build do Vite
        run: npm run build

      - name: Publicar build na raiz da main
        shell: bash
        run: |
          rm -rf assets
          rm -f manifest.webmanifest registerSW.js sw.js workbox-*.js .nojekyll
          cp -R dist/* ./
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no build."
            exit 0
          fi

          git commit -m "chore: publish Vite build [pages-build]"
          git push origin HEAD:main
