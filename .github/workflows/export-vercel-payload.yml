name: Export Vercel payload

on:
  push:
    branches: [feat/leitor-dm-integration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/leitor-dm-integration
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: GITHUB_ACTIONS=false npm run build
      - name: Build chunked deployment payload
        run: |
          rm -rf .deploy-manifest
          mkdir -p .deploy-manifest
          node <<'NODE'
          const fs=require('fs'), path=require('path');
          const root='dist';
          const out='.deploy-manifest';
          const target=540000;
          const entries=[];
          function walk(dir){
            for(const name of fs.readdirSync(dir)){
              const full=path.join(dir,name);
              const st=fs.statSync(full);
              if(st.isDirectory()) walk(full);
              else {
                const rel=full.split(path.sep).join('/');
                entries.push({file:rel,data:fs.readFileSync(full).toString('base64'),encoding:'base64'});
              }
            }
          }
          walk(root);
          entries.sort((a,b)=>a.file.localeCompare(b.file));
          let parts=[], current=[], size=2;
          for(const entry of entries){
            const eSize=JSON.stringify(entry).length+1;
            if(current.length && size+eSize>target){parts.push(current);current=[];size=2;}
            current.push(entry); size+=eSize;
          }
          if(current.length) parts.push(current);
          parts.forEach((part,i)=>fs.writeFileSync(path.join(out,`part-${String(i).padStart(2,'0')}.json`),JSON.stringify(part)));
          fs.writeFileSync(path.join(out,'meta.json'),JSON.stringify({files:entries.length,parts:parts.length,bytes:entries.reduce((n,e)=>n+e.data.length,0)}));
          NODE
      - name: Commit deployment payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .deploy-manifest
          git commit -m "chore(deploy): export validated Vercel payload"
          git push origin HEAD:feat/leitor-dm-integration
